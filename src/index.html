<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MyDaily</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Suivi quotidien des habitudes">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2da44e">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyDaily">
  <link rel="apple-touch-icon" href="icons/icon-152x152.png">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- Contenu de démarrage : Angular le remplace en s'amorçant. Sans lui, le
       premier écran est blanc et muet le temps du bundle puis du chunk de
       route — assez long sur mobile pour qu'on croie l'app plantée et qu'on la
       relance. Tout est en ligne : aucune requête ne doit précéder cet
       affichage. -->
  <app-root>
    <div class="boot">
      <div class="boot-spinner"></div>
      <p>MyDaily</p>
    </div>
  </app-root>
  <style>
    .boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #ffffff;
      color: #656d76;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }
    .boot-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e8eaed;
      border-top-color: #2da44e;
      border-radius: 50%;
      animation: boot-spin 0.8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      .boot { background: #0d1117; color: #8b949e; }
      .boot-spinner { border-color: #21262d; border-top-color: #2da44e; }
    }
  </style>
</body>
</html>
